agent:
  allow_methods:
    - eth_chainId
    - eth_blockNumber
    - eth_call
    - eth_getBalance
    - eth_getCode
    - eth_getStorageAt
    - eth_getLogs
    - eth_getTransactionByHash
    - eth_getTransactionReceipt
    - web3_clientVersion
upstream:
  allow_methods:
    - eth_chainId
    - eth_blockNumber
    - eth_call
    - eth_getBalance
    - eth_getCode
    - eth_getStorageAt
    - eth_getLogs
    - eth_getBlockByNumber
    - eth_getTransactionByHash
    - eth_getTransactionReceipt
