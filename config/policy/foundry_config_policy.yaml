security:
  ffi: false
  fs_permissions: []
  libs: []
  rpc_endpoints: {l0vi0x_gate: gate-only}
  always_use_create_2_factory: true
  fuzz: {runs: 256, seed: 1}
allowed_profile_keys: [src, test, out, libs, solc_version, evm_version, optimizer, optimizer_runs]
forbidden_keys:
  - rpc_endpoints
  - private_keys
  - mnemonic
  - sender
  - ffi
  - fs_permissions
  - libraries
  - scripts
  - preprocessor
